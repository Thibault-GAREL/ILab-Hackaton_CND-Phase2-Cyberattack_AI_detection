name: cnd-phase2

services:
  backend:
    build:
      context: ..
      dockerfile: backend/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ENV=production
      - DETECTIONS_JSON_PATH=/app/detections.json
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - ../detections.json:/app/detections.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.streamlit
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
